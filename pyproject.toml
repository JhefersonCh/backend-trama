[project]
name = "trama-backend"
version = "0.1.0"
description = "TRAMA backend: configuration API + health"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
    "python-multipart>=0.0.20",
    "pypdf==6.21.4",
    "pyyaml>=6.0.3",
    "pillow>=13.0.0",
    "jinja2>=3.1",
    "weasyprint>=63",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

