version = 1

; Per-model defaults for the llama.cpp router. Section name = router model id.
; Models are fetched from Hugging Face on first load/download into LLAMA_CACHE (volume models-gguf).
[*]
parallel = 1
no-webui = true

[LiquidAI/LFM3-1.7B-GGUF:Q4_K_M]
hf-repo = LiquidAI/LFM3-1.7B-GGUF:Q4_K_M
c = 8192
jinja = true
; LFM3 thinks by default (reasoning_content burns tokens/latency); keep it off
reasoning = off
; CPU tuning measured on i7-1355U (10 cores / 12 threads, WSL2), 1085-token prompt:
;   threads 4 -> 70 tok/s prompt, 6 (default) -> 78, 8 -> 89, 10 -> 98; generation ~11-13 tok/s for all.
threads = 10
; Prompt cache: LFM3 is hybrid (conv + attention), so llama.cpp can only roll back to a context checkpoint, which
; it saves ~n_ubatch+4 (516) tokens before the end of each prompt; `cache-reuse` is unsupported for it (server
; disables it). Measured: smaller ubatch / checkpoint-min-step did NOT help (cache_n dropped to 0), so defaults.

[ggml-org/embeddinggemma-2-GGUF:BF16]
hf-repo = ggml-org/embeddinggemma-2-GGUF:BF16
embeddings = true
no-mmproj = true
c = 2048

[unsloth/gemma-4-E2B-it-GGUF:Q4_K_M]
; Gemma 4 E2B (2.3B effective / ~5.1B total). Text only: skip the vision projector.
hf-repo = unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
no-mmproj = true
c = 8192
jinja = true
; Gemma 4 thinks by default and spends the whole budget on reasoning_content -> keep it off
reasoning = off
; CPU (i7-1355U): generation is memory-bound -> 6 threads (4.8 tok/s @10 vs 7.6 @6); prompt uses more
threads = 6
threads-batch = 10

[gemma-4-E2B-it-vision]
; Same Gemma 4 E2B weights as above but WITH the multimodal projector (mmproj, auto-downloaded from the repo by
; `hf-repo`), used by the `vision` role (photo analysis). Separate router id so the text section keeps `no-mmproj`
; and text turns stay light. Loaded only on demand; the backend ModelManager evicts others by RAM budget.
hf-repo = unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
c = 4096
jinja = true
reasoning = off
threads = 6
threads-batch = 10
; cap the image token budget so a photo costs seconds, not minutes, on CPU
image-max-tokens = 560
